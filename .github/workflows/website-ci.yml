name: website-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit:public
      - run: pnpm package:site
      - uses: actions/upload-artifact@v4
        with:
          name: stormforge-site-${{ github.sha }}
          path: |
            dist/
            artifacts/stormforge-site-*
          if-no-files-found: error
          retention-days: 14
