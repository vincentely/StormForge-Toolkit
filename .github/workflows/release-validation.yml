name: release-validation
on:
  push:
    branches: [main]
    paths: ['release/**', 'scripts/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/release-validation.yml']
  pull_request:
    paths: ['release/**', 'scripts/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/release-validation.yml']
  workflow_dispatch:
    inputs:
      verify_remote:
        description: Verify published artifact bytes on both download hosts
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:release
      - run: pnpm test
      - run: pnpm audit:public
      - if: github.event_name == 'workflow_dispatch' && inputs.verify_remote
        run: node scripts/verify-remote.mjs
