# Static internal-test website and existing StormForge API routes.
# Back up and compare the live configuration before installation.
server {
    listen 80;
    listen [::]:80;
    server_name stormforge-beta.vollagames.com stormforge.vollagames.com;
    return 301 https://$host$request_uri;
}

# Beta remains entirely proxied, matching the upstream configuration.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stormforge-beta.vollagames.com;
    ssl_certificate /etc/letsencrypt/live/stormforge.vollagames.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stormforge.vollagames.com/privkey.pem;
    ssl_protocols TLSv1.2;
    ssl_ecdh_curve X25519:prime256v1;
    location / {
        proxy_pass https://127.0.0.1:18443;
        proxy_ssl_server_name on;
        proxy_ssl_name stormforge-beta.vollagames.com;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stormforge.vollagames.com;
    ssl_certificate /etc/letsencrypt/live/stormforge.vollagames.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stormforge.vollagames.com/privkey.pem;
    ssl_protocols TLSv1.2;
    ssl_ecdh_curve X25519:prime256v1;

    root /srv/stormforge-site/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # No trailing slash on proxy_pass: preserve path and OAuth query strings.
    # Includes /v1/oauth/github/callback and /v1/oauth/wechat/callback.
    location ^~ /v1/ {
        proxy_pass https://127.0.0.1:19443;
        proxy_ssl_server_name on;
        proxy_ssl_name stormforge.vollagames.com;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /healthz {
        proxy_pass https://127.0.0.1:19443;
        proxy_ssl_server_name on;
        proxy_ssl_name stormforge.vollagames.com;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    error_page 404 /404.html;
    location ~ /\. { deny all; }
}
