# Server-level rewrites run before the release service's standalone page locations.
# Archive, blob and signed manifest requests still use stormhub-downloads.conf.
rewrite ^/download/$ /download/index.html last;
rewrite ^/downloads/$ /downloads/index.html last;

location = /download/index.html {
    root /srv/stormforge-site/current;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

location = /downloads/index.html {
    root /srv/stormforge;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
