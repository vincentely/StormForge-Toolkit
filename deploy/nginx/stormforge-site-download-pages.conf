# All public HTML download entry points share the website's channel availability.
# Archive, blob and signed manifest requests still use stormhub-downloads.conf.
rewrite ^/download/$ /download/index.html last;
rewrite ^/downloads(?:/|/index\.html)?$ /download/index.html last;

location = /download/index.html {
    root /srv/stormforge-site/current;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
